name: release

# Push a tag like v0.2.0 (matching "version" in src-tauri/tauri.conf.json) to build macOS and
# Windows bundles and publish them as a GitHub release. Run manually to rebuild an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match tauri.conf.json version $version"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: winfer ${{ env.TAG }}
          releaseBody: |
            Unsigned builds.

            **macOS** — open the `.dmg` for your Mac (`aarch64` = Apple silicon, `x64` = Intel) and drag winfer to Applications. On first launch run `xattr -dr com.apple.quarantine /Applications/winfer.app` (or right-click → Open).

            **Windows** — run the `-setup.exe` (or the `.msi`); SmartScreen will warn because the installer isn't signed: More info → Run anyway.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
