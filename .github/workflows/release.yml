name: release

# Push a tag like v0.2.0 (matching "version" in src-tauri/tauri.conf.json) to build macOS and
# Windows bundles and publish them as a GitHub release. Run manually to rebuild an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # One job creates the release; the bundle jobs only upload to it. (When each bundle job
  # created it, two jobs raced and v0.1.2 ended up as two releases with split downloads.)
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      # Test once, before the release exists, rather than in every bundle job.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Create the release with this version's changes
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            {
              echo "### Changes"
              # Commit subjects since the previous release, minus the version-bump commits.
              git log --format='- %s' ${prev:+$prev..}"$TAG" | grep -v -E '^- Release [0-9.]+$' | sed -E 's/; release [0-9.]+$//'
              cat .github/release-footer.md
            } > notes.md
            # Not "latest" yet: the previous release keeps that spot (and serves latest.json to
            # installed apps) until the updater-json job has every bundle up.
            gh release create "$TAG" --title "winfer $TAG" --notes-file notes.md --latest=false
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  bundle:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match tauri.conf.json version $version"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles (.app.tar.gz, -setup.exe, .msi) with the key whose public
          # half is plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: --target ${{ matrix.target }}
          # The updater-json job writes it once every bundle is up; three jobs merging into
          # one file at once could drop a platform.
          includeUpdaterJson: false

  # latest.json is what installed apps poll (releases/latest/download/latest.json): the newest
  # version and, per platform, the signed bundle's URL and signature.
  updater-json:
    needs: [release, bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Write latest.json from the release's signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir sigs && cd sigs
          gh release download "$TAG" --pattern '*.sig'
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          entry() { jq -n --arg sig "$(cat "$1")" --arg url "$base/${1%.sig}" '{signature: $sig, url: $url}'; }
          platforms='{}'
          add() { platforms=$(jq --arg k "$1" --argjson v "$(entry "$2")" '.[$k] = $v' <<<"$platforms"); }
          for f in *.sig; do
            case "$f" in
              *aarch64*.app.tar.gz.sig) add darwin-aarch64 "$f" ;;
              *.app.tar.gz.sig) add darwin-x86_64 "$f" ;;
              *-setup.exe.sig) add windows-x86_64-nsis "$f"; add windows-x86_64 "$f" ;;
              *.msi.sig) add windows-x86_64-msi "$f" ;;
            esac
          done
          for k in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg k "$k" 'has($k)' <<<"$platforms" >/dev/null || { echo "::error::No signed bundle for $k"; exit 1; }
          done
          cd ..
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "$(gh release view "$TAG" --json body -q .body)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: $platforms}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
      - name: Mark the release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # "legacy" lets GitHub pick by creation date and semver, so rebuilding an older tag by
        # hand doesn't take "latest" away from a newer release.
        run: |
          id=${{ needs.release.outputs.id }}
          gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -f make_latest=legacy >/dev/null
