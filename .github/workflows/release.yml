name: release

# Builds macOS, Windows and Linux bundles of the native GPUI app (native/) for a tag and publishes
# them as a GitHub release. The Tauri app is deprecated and no longer built. The tag is the version
# (stamped into the app here, so the files in the repo don't need bumping) and picks the channel:
#   nebula    v0.1.102-57  every push to main (nebula.yml); a pre-release, published to the
#                          Nebula feed (nebula-channel release's latest-native.json)
#   stable    v0.1.102     promoted from a Nebula build (stable.yml); the latest release
#                          (releases/latest/download/latest-native.json), also published to the Nebula feed
# Users pick which feed their app follows in settings. The feed on those releases is
# latest-native.json (native/crates/winfer-app/src/updates.rs). Run manually to rebuild an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      winferd_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.102 or v0.1.102-57
        required: true
      # A test of the server builds: winferd's tarballs and its image under the version only; no
      # desktop bundles, no update feed, no :latest/:nebula image (installed apps don't see it).
      winferd_only:
        description: Only winferd (no desktop bundles, update feeds or channel image tags)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}

env:
  TAG: ${{ inputs.tag }}
  # The Nebula channel's update feed: a fixed release whose latest-native.json each build replaces.
  FEED_TAG: nebula-channel

jobs:
  # One job creates the release; the bundle jobs only upload to it.
  release:
    runs-on: avrea-ubuntu-latest-8-vcpu
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Create the release with this version's changes
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Stable notes cover everything since the previous stable release; Nebula ones,
            # since the previous build of either channel.
            if [[ $TAG == *-* ]]; then
              prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
              channel=(--prerelease)
            else
              prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$TAG^" 2>/dev/null || true)
              channel=()
            fi
            {
              echo "### Changes"
              # Commit subjects since the previous release, minus the version-bump commits.
              git log --format='- %s' ${prev:+$prev..}"$TAG" | grep -v -E '^- Release [0-9.]+$' | sed -E 's/; release [0-9.]+$//'
              cat .github/release-footer.md
            } > notes.md
            # Not "latest" yet: the previous release keeps that spot (and serves latest-native.json to
            # installed apps) until the native-updater-json job has every bundle up.
            gh release create "$TAG" --title "winfer $TAG" --notes-file notes.md --latest=false "${channel[@]}"
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  # winferd, winfer for servers (native/crates/winferd): one tarball + checksum per platform,
  # winferd-<os>-<arch>.tar.gz, which install.sh fetches. Linux builds on 22.04 (glibc 2.35).
  winferd:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: avrea-ubuntu-latest-8-vcpu
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-aarch64
          - platform: avrea-macos-latest-8-vcpu
            target: aarch64-apple-darwin
            asset: macos-aarch64
          - platform: avrea-macos-latest-8-vcpu
            target: x86_64-apple-darwin
            asset: macos-x86_64
    runs-on: ${{ matrix.platform }}
    env:
      RUSTC_WRAPPER: sccache
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Stamp version
        run: |
          VERSION=${TAG#v} perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' native/Cargo.toml
          grep -q "^version = \"${TAG#v}\"" native/Cargo.toml || { echo "::error::Couldn't stamp $TAG into native/Cargo.toml"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/sccache
      - name: Build
        working-directory: native
        run: |
          # The stamped version is the workspace crates' own: only their lock entries change.
          cargo update --workspace
          cargo build --release --locked -p winferd --target ${{ matrix.target }}
      - name: Package and upload
        run: |
          name=winferd-${{ matrix.asset }}
          tar -C native/target/${{ matrix.target }}/release -czf "$name.tar.gz" winferd
          shasum -a 256 "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
          # winferd update reads the newest stable release's tag from releases/latest/download/.
          echo "$TAG" > winferd-version.txt
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" native/crates/winferd/install.sh winferd-version.txt --clobber

  # winferd's Docker image (amd64 + arm64) from the release's binaries: ghcr.io/<owner>/winferd
  # :<version>, and :latest (stable) or :nebula (Nebula builds).
  winferd-image:
    needs: winferd
    runs-on: avrea-ubuntu-latest-8-vcpu
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/winferd
          channel=$([[ $TAG == *-* ]] && echo nebula || echo latest)
          if [ "${{ inputs.winferd_only }}" = "true" ]; then
            echo "tags=$image:${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:${TAG#v},$image:$channel" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: native/crates/winferd/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BIN=release
            VERSION=${{ env.TAG }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  # The native GPUI build (native/) of this version, into the release.
  native-bundle:
    needs: release
    if: ${{ !inputs.winferd_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: avrea-macos-latest-8-vcpu
            target: aarch64-apple-darwin
          - platform: avrea-macos-latest-8-vcpu
            target: x86_64-apple-darwin
          - platform: avrea-windows-latest-8-vcpu
            target: x86_64-pc-windows-msvc
          - platform: avrea-ubuntu-latest-8-vcpu
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    env:
      RUSTC_WRAPPER: sccache
      # Anonymous usage data (native/crates/winfer-app/src/telemetry.rs): compiled in; without
      # the secret the build sends nothing. The host defaults to PostHog US.
      WINFER_POSTHOG_KEY: ${{ secrets.WINFER_POSTHOG_KEY }}
      WINFER_POSTHOG_HOST: ${{ vars.WINFER_POSTHOG_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The workspace version is the app's (CARGO_PKG_VERSION, which updates.rs compares).
      - name: Stamp version
        shell: bash
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::Tag $TAG isn't vX.Y.Z (stable) or vX.Y.Z-N (Nebula)"
            exit 1
          fi
          # [^"]* rather than ".*"$: Windows checkouts have CRLF line endings, where $ doesn't match
          # before the \r, so the version silently stayed the placeholder in native/Cargo.toml.
          VERSION=${TAG#v} perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' native/Cargo.toml
          grep -q "^version = \"${TAG#v}\"" native/Cargo.toml || { echo "::error::Couldn't stamp $TAG into native/Cargo.toml"; exit 1; }
          git diff --stat

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/sccache

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libfontconfig1-dev

      # Developer ID and notarization secrets. The certificate goes into a throwaway keychain for
      # codesign, and bundle-macos.sh signs, notarizes and staples. Without the certificate secrets the
      # build is ad-hoc signed and not notarized.
      #   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY (optional)
      #   notarization: APPLE_API_KEY/APPLE_API_ISSUER/APPLE_API_KEY_P8, or APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID
      - name: macOS signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::warning::No Developer ID certificate secrets; building ad-hoc signed and not notarized"
            exit 0
          fi
          put() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; }
          keychain="$RUNNER_TEMP/winfer-native.keychain-db"
          password=$(openssl rand -hex 16)
          printf '%s' "$APPLE_CERTIFICATE" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$APPLE_SIGNING_IDENTITY
          [ -n "$identity" ] || identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -n1)
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in APPLE_CERTIFICATE"; exit 1; }
          put WINFER_SIGN_IDENTITY "$identity"
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
            chmod 600 "$key_path"
            put APPLE_API_KEY "$APPLE_API_KEY"
            put APPLE_API_ISSUER "$APPLE_API_ISSUER"
            put APPLE_API_KEY_PATH "$key_path"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            put APPLE_ID "$APPLE_ID"
            put APPLE_PASSWORD "$APPLE_PASSWORD"
            put APPLE_TEAM_ID "$APPLE_TEAM_ID"
          else
            echo "::error::Developer ID certificate set but no notarization credentials (APPLE_API_* or APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID)"
            exit 1
          fi
          put WINFER_NOTARIZE 1

      # Builds the Windows installer (bundle-windows.sh skips it without ISCC).
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: bash
        run: |
          [ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress

      # macOS: winfer.app as .dmg and .app.tar.gz; Windows: the portable .exe and an installer; Linux: a .tar.gz of the binary.
      - name: Build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) bash native/scripts/bundle-macos.sh ${{ matrix.target }} ;;
            # Without sccache: gpui's rustc command line is too long for it to start on Windows (os error 206).
            Windows) env -u RUSTC_WRAPPER bash native/scripts/bundle-windows.sh ${{ matrix.target }} ;;
            Linux) bash native/scripts/bundle-linux.sh ${{ matrix.target }} ;;
          esac

      - name: Verify signature and notarization
        if: runner.os == 'macOS' && env.WINFER_NOTARIZE == '1'
        shell: bash
        run: |
          app=native/target/bundle/winfer.app
          codesign --verify --deep --strict --verbose=2 "$app"
          info=$(codesign -dv --verbose=4 "$app" 2>&1)
          grep -q 'Authority=Developer ID Application' <<<"$info" || { echo "::error::Not Developer ID signed"; exit 1; }
          grep -q 'flags=.*runtime' <<<"$info" || { echo "::error::Hardened runtime missing"; exit 1; }
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              [ "$n" -ge 5 ] && return 1
              echo "::warning::$1 failed (attempt $n/5), retrying in $((n * 15))s"
              sleep $((n * 15))
            done
          }
          retry xcrun stapler validate "$app"
          retry spctl --assess --type execute --verbose=4 "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native/target/bundle/winfer-native_*
          if-no-files-found: error
          retention-days: 7

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

  # Signs the native update bundles with the Tauri app's updater key (the native app checks them
  # against tauri.conf.json's pubkey), uploads everything to the release and writes
  # latest-native.json: the release's, which stable apps read once it's the latest, and the
  # nebula-channel release's, which Nebula apps read.
  native-updater-json:
    needs: [release, native-bundle]
    if: ${{ !inputs.winferd_only }}
    runs-on: avrea-ubuntu-latest-8-vcpu
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # For the tauri CLI's signer (the update key's tooling; the app itself isn't Tauri).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-bundles
          merge-multiple: true

      - name: Sign the update bundles and upload them to the release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          # What installed apps download (the .dmg is only for first installs).
          for f in native-bundles/*.app.tar.gz native-bundles/winfer-native_*_windows-*[!p].exe native-bundles/winfer-native_*_linux-*.tar.gz; do
            pnpm tauri signer sign "$f"
          done
          ls -l native-bundles
          gh release upload "$TAG" native-bundles/* --clobber

      - name: Write latest-native.json
        run: |
          cd native-bundles
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          platforms='{}'
          add() { platforms=$(jq --arg k "$1" --arg sig "$(cat "$2.sig")" --arg url "$base/$2" '.[$k] = {signature: $sig, url: $url}' <<<"$platforms"); }
          # Keys as in updates.rs: platform().
          for sig in *.sig; do
            f=${sig%.sig}
            case "$f" in
              winfer-native_*_macos-*.app.tar.gz) arch=${f##*_macos-}; add "darwin-${arch%.app.tar.gz}" "$f" ;;
              winfer-native_*_windows-*.exe) arch=${f##*_windows-}; add "windows-${arch%.exe}" "$f" ;;
              winfer-native_*_linux-*.tar.gz) arch=${f##*_linux-}; add "linux-${arch%.tar.gz}" "$f" ;;
            esac
          done
          for k in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            jq -e --arg k "$k" 'has($k)' <<<"$platforms" >/dev/null || { echo "::error::No signed native bundle for $k"; exit 1; }
          done
          cd ..
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "$(gh release view "$TAG" --json body -q .body)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: $platforms}' > latest-native.json
          cat latest-native.json
          gh release upload "$TAG" latest-native.json --clobber

      # Nebula and stable builds both go to the feed, never replacing a newer one.
      - name: Publish to the Nebula channel
        run: |
          key() {
            local core=${1%%-*} pre=
            [[ $1 == *-* ]] && pre=${1#*-}
            IFS=. read -r a b c <<<"$core"
            if [ -n "$pre" ]; then printf '%06d.%06d.%06d.0%06d' "$a" "$b" "$c" "$pre"; else printf '%06d.%06d.%06d.1' "$a" "$b" "$c"; fi
          }
          if ! gh release view "$FEED_TAG" >/dev/null 2>&1; then
            gh release create "$FEED_TAG" --prerelease --latest=false --target "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" -q .object.sha)" \
              --title "Nebula channel" --notes "Update feed for Nebula builds of winfer. Download the newest pre-release instead." \
              || gh release view "$FEED_TAG" >/dev/null
          fi
          mkdir feed
          current=$(gh release download "$FEED_TAG" --pattern latest-native.json --dir feed >/dev/null 2>&1 && jq -r .version feed/latest-native.json || true)
          if [ -n "$current" ] && [[ $(key "$current") > $(key "${TAG#v}") ]]; then
            echo "The Nebula channel already has native $current; leaving it"
            exit 0
          fi
          gh release upload "$FEED_TAG" latest-native.json --clobber

      - name: Mark the release as latest
        if: ${{ !contains(inputs.tag, '-') }}
        # Explicitly, not "legacy": with legacy GitHub picks by creation date and semver, so every
        # new release became latest the moment it was created, before its bundles were up.
        # Rebuilding an older tag by hand leaves "latest" on the newer release.
        run: |
          current=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          [[ $current == *-* ]] && current=
          newest=$(printf '%s\n%s\n' "$current" "$TAG" | sed '/^$/d' | sort -V | tail -n1)
          if [ "$newest" != "$TAG" ]; then
            echo "$current is newer than $TAG; leaving it as latest"
            exit 0
          fi
          gh api -X PATCH "repos/$GH_REPO/releases/${{ needs.release.outputs.id }}" -f make_latest=true >/dev/null
