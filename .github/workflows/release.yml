name: release

# Builds macOS and Windows bundles for a tag and publishes them as a GitHub release. The tag is
# the version (stamped into the app here, so the files in the repo don't need bumping) and picks
# the channel:
#   nebula    v0.1.102-57  every push to main (nebula.yml); a pre-release, published to the
#                          Nebula feed (nebula-channel release's latest.json)
#   stable    v0.1.102     promoted from a Nebula build (stable.yml); the latest release
#                          (releases/latest/download/latest.json), also published to the Nebula feed
# Users pick which feed their app follows in settings, whichever build they installed.
# Run manually to rebuild an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.102 or v0.1.102-57
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}

env:
  TAG: ${{ inputs.tag }}
  # The Nebula channel's update feed: a fixed release whose latest.json each build replaces.
  FEED_TAG: nebula-channel

jobs:
  # One job creates the release; the bundle jobs only upload to it. (When each bundle job
  # created it, two jobs raced and v0.1.2 ended up as two releases with split downloads.)
  release:
    runs-on: avrea-ubuntu-latest-2-vcpu
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      # Test once, before the release exists, rather than in every bundle job.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Create the release with this version's changes
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Stable notes cover everything since the previous stable release; Nebula ones,
            # since the previous build of either channel.
            if [[ $TAG == *-* ]]; then
              prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
              channel=(--prerelease)
            else
              prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$TAG^" 2>/dev/null || true)
              channel=()
            fi
            {
              echo "### Changes"
              # Commit subjects since the previous release, minus the version-bump commits.
              git log --format='- %s' ${prev:+$prev..}"$TAG" | grep -v -E '^- Release [0-9.]+$' | sed -E 's/; release [0-9.]+$//'
              cat .github/release-footer.md
            } > notes.md
            # Not "latest" yet: the previous release keeps that spot (and serves latest.json to
            # installed apps) until the updater-json job has every bundle up.
            gh release create "$TAG" --title "winfer $TAG" --notes-file notes.md --latest=false "${channel[@]}"
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  bundle:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: avrea-macos-26-8-vcpu
            target: aarch64-apple-darwin
          - platform: avrea-macos-26-8-vcpu
            target: x86_64-apple-darwin
          - platform: avrea-windows-2025-8-vcpu
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    # Rust goes through sccache on Avrea's WebDAV cache. actions/cache (what rust-cache used) is
    # scoped to the ref that saved it, so a cache saved under one tag was never visible to the
    # next tag's run and every release compiled from scratch; sccache's store isn't ref-scoped.
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The tag is the version (Nebula ones with a numeric pre-release, which the MSI bundler
      # requires). Nebula builds start on the Nebula update channel; users can switch either
      # way in settings (app_updates.rs).
      - name: Stamp version
        shell: bash
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::Tag $TAG isn't vX.Y.Z (stable) or vX.Y.Z-N (Nebula)"
            exit 1
          fi
          node - <<'EOF'
          const fs = require("fs");
          const version = process.env.TAG.replace(/^v/, "");
          const edit = (file, fn) => fs.writeFileSync(file, fn(fs.readFileSync(file, "utf8")));
          edit("src-tauri/tauri.conf.json", (s) => {
            const conf = JSON.parse(s);
            conf.version = version;
            return JSON.stringify(conf, null, 2) + "\n";
          });
          edit("src-tauri/Cargo.toml", (s) => s.replace(/^version = ".*"$/m, `version = "${version}"`));
          edit("package.json", (s) => s.replace(/"version": ".*?"/, `"version": "${version}"`));
          EOF
          git diff --stat

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/sccache

      # The Windows image has Visual Studio 2026, which whisper-rs-sys's CMake build only finds
      # with CMake 4.2+.
      - if: runner.os == 'Windows'
        uses: lukka/get-cmake@v4.4.2

      - run: pnpm install --frozen-lockfile

      # Developer ID signing + notarization. tauri imports APPLE_CERTIFICATE into a temporary
      # keychain, signs the .app with the hardened runtime and Entitlements.plist, submits it to
      # Apple's notary service and staples the ticket (the .dmg and updater .app.tar.gz are built
      # from the stapled app). Exported only when the secrets exist: GitHub passes a missing secret
      # as "", which tauri would try to use, so without them the build stays ad-hoc signed ("-"
      # in tauri.conf.json) and isn't notarized.
      #   APPLE_CERTIFICATE           base64 of the "Developer ID Application" .p12
      #   APPLE_CERTIFICATE_PASSWORD  the .p12's export password
      #   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)" (optional)
      #   notarization, either an App Store Connect API key (preferred):
      #     APPLE_API_KEY (key ID), APPLE_API_ISSUER (issuer ID), APPLE_API_KEY_P8 (the .p8's text)
      #   or an Apple ID: APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
      - name: macOS signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::warning::No Developer ID certificate secrets; building ad-hoc signed and not notarized"
            exit 0
          fi
          put() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; }
          # Multi-line safe: the certificate is one base64 line, but strip any wrapping anyway.
          put APPLE_CERTIFICATE "$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '\r\n ')"
          put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          [ -n "$APPLE_SIGNING_IDENTITY" ] && put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
            chmod 600 "$key_path"
            put APPLE_API_KEY "$APPLE_API_KEY"
            put APPLE_API_ISSUER "$APPLE_API_ISSUER"
            put APPLE_API_KEY_PATH "$key_path"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            put APPLE_ID "$APPLE_ID"
            put APPLE_PASSWORD "$APPLE_PASSWORD"
            put APPLE_TEAM_ID "$APPLE_TEAM_ID"
          else
            echo "::error::Developer ID certificate set but no notarization credentials (APPLE_API_* or APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID)"
            exit 1
          fi
          echo "WINFER_NOTARIZED=1" >> "$GITHUB_ENV"

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles (.app.tar.gz, -setup.exe, .msi) with the key whose public
          # half is plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: --target ${{ matrix.target }}
          # The updater-json job writes it once every bundle is up; three jobs merging into
          # one file at once could drop a platform.
          includeUpdaterJson: false

      # Fail the release if the shipped app isn't what Gatekeeper accepts on a fresh Mac.
      - name: Verify signature and notarization
        if: runner.os == 'macOS' && env.WINFER_NOTARIZED == '1'
        shell: bash
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/winfer.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          info=$(codesign -dv --verbose=4 "$app" 2>&1)
          grep -q 'Authority=Developer ID Application' <<<"$info" || { echo "::error::Not Developer ID signed"; exit 1; }
          grep -q 'flags=.*runtime' <<<"$info" || { echo "::error::Hardened runtime missing"; exit 1; }
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

  # latest.json is what installed apps poll: the newest version and, per platform, the signed
  # bundle's URL and signature. Stable apps read it from the latest release, Nebula apps from
  # the nebula-channel release.
  updater-json:
    needs: [release, bundle]
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - name: Write latest.json from the release's signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir sigs && cd sigs
          gh release download "$TAG" --pattern '*.sig'
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          entry() { jq -n --arg sig "$(cat "$1")" --arg url "$base/${1%.sig}" '{signature: $sig, url: $url}'; }
          platforms='{}'
          add() { platforms=$(jq --arg k "$1" --argjson v "$(entry "$2")" '.[$k] = $v' <<<"$platforms"); }
          for f in *.sig; do
            case "$f" in
              *aarch64*.app.tar.gz.sig) add darwin-aarch64 "$f" ;;
              *.app.tar.gz.sig) add darwin-x86_64 "$f" ;;
              *-setup.exe.sig) add windows-x86_64-nsis "$f"; add windows-x86_64 "$f" ;;
              *.msi.sig) add windows-x86_64-msi "$f" ;;
            esac
          done
          for k in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg k "$k" 'has($k)' <<<"$platforms" >/dev/null || { echo "::error::No signed bundle for $k"; exit 1; }
          done
          cd ..
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "$(gh release view "$TAG" --json body -q .body)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: $platforms}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
      # Nebula builds always go to the feed; stable ones too, so Nebula apps move onto a stable
      # release of their version. Never replace a newer build (e.g. when rebuilding an old tag).
      - name: Publish to the Nebula channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Sortable key: X.Y.Z-N sorts before X.Y.Z, as in semver.
          key() {
            local core=${1%%-*} pre=
            [[ $1 == *-* ]] && pre=${1#*-}
            IFS=. read -r a b c <<<"$core"
            if [ -n "$pre" ]; then printf '%06d.%06d.%06d.0%06d' "$a" "$b" "$c" "$pre"; else printf '%06d.%06d.%06d.1' "$a" "$b" "$c"; fi
          }
          if ! gh release view "$FEED_TAG" >/dev/null 2>&1; then
            gh release create "$FEED_TAG" --prerelease --latest=false --target "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" -q .object.sha)" \
              --title "Nebula channel" --notes "Update feed for Nebula builds of winfer. Download the newest pre-release instead."
          fi
          mkdir feed
          current=$(gh release download "$FEED_TAG" --pattern latest.json --dir feed >/dev/null 2>&1 && jq -r .version feed/latest.json || true)
          if [ -n "$current" ] && [[ $(key "$current") > $(key "${TAG#v}") ]]; then
            echo "The Nebula channel already has $current; leaving it"
            exit 0
          fi
          gh release upload "$FEED_TAG" latest.json --clobber
      - name: Mark the release as latest
        if: ${{ !contains(inputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # Explicitly, not "legacy": with legacy GitHub picks by creation date and semver, so every
        # new release became latest the moment it was created, before its bundles were up.
        # Rebuilding an older tag by hand leaves "latest" on the newer release.
        run: |
          current=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          [[ $current == *-* ]] && current=
          newest=$(printf '%s\n%s\n' "$current" "$TAG" | sed '/^$/d' | sort -V | tail -n1)
          if [ "$newest" != "$TAG" ]; then
            echo "$current is newer than $TAG; leaving it as latest"
            exit 0
          fi
          id=${{ needs.release.outputs.id }}
          gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -f make_latest=true >/dev/null
