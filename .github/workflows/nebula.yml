name: nebula

# Every push to main ships the native app to the Nebula channel as vX.Y.Z-N: X.Y.Z is the next stable version
# (the patch after the last stable tag, or native/Cargo.toml's version when that's newer, so a
# minor/major bump is just editing it) and N this workflow's run number. Pushes landing while a
# build runs are batched into the next one. (Kept as nebula.yml so the run number, and so the
# tag numbering, carries on.)
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

# Main runs queue so each batch of pushes still ships.
concurrency:
  group: nebula-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the build
        id: tag
        run: |
          stable=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          conf=$(sed -n 's/^version = "\(.*\)"$/\1/p' native/Cargo.toml | head -n1)
          next=$conf
          if [ -n "$stable" ]; then
            IFS=. read -r major minor patch <<<"${stable#v}"
            next=$(printf '%s\n%s\n' "$major.$minor.$((patch + 1))" "$conf" | sort -V | tail -n1)
          fi
          tag="v$next-${{ github.run_number }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists already (re-run)"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
