name: sccache
description: Install sccache and start it against the GitHub Actions build cache.
runs:
  using: composite
  steps:
    - uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.18.0
    - name: Start sccache on the GitHub Actions cache backend
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        export SCCACHE_GHA_ENABLED=true
        sccache --start-server
        sccache --show-stats
