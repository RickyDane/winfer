<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824" width="824" height="824">
  <!-- winfer logo, full bleed: the indigo tile fills the whole square; iOS/Android round the corners themselves. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b88ff"/>
      <stop offset="0.55" stop-color="#5a5ff0"/>
      <stop offset="1" stop-color="#3a2db0"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16172a"/>
      <stop offset="1" stop-color="#0c0c16"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b0b2a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  <!-- left pane: terminal prompt -->
  <rect x="190" y="190" width="318" height="644" rx="64" fill="url(#pane)"/>
  <polyline points="262,436 352,512 262,588" fill="none" stroke="#aab3ff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="384" y="566" width="84" height="44" rx="22" fill="#aab3ff"/>

  <!-- top right pane: voice waveform -->
  <rect x="534" y="190" width="300" height="306" rx="64" fill="url(#pane)"/>
  <g fill="#ffffff">
    <rect x="583" y="309" width="30" height="68" rx="15"/>
    <rect x="633" y="263" width="30" height="160" rx="15"/>
    <rect x="683" y="235" width="30" height="216" rx="15"/>
    <rect x="733" y="281" width="30" height="124" rx="15"/>
  </g>

  <!-- bottom right pane: an agent's status line, working -->
  <rect x="534" y="522" width="300" height="312" rx="64" fill="url(#pane)"/>
  <circle cx="602" cy="628" r="24" fill="#4ade80"/>
  <rect x="646" y="608" width="130" height="40" rx="20" fill="#7d86f0"/>
  <rect x="582" y="700" width="194" height="40" rx="20" fill="#3d4196"/>
</svg>
