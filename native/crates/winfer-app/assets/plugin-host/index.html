<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        --radius-pane: 10px;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--color-panel);
        color: var(--color-fg);
        font-family: var(--font-sans);
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      #page {
        height: 100%;
        overflow-y: auto;
        user-select: text;
      }
      #error {
        margin: 24px;
        font-size: 12px;
        color: var(--color-danger);
      }
      #error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <p id="error"></p>
    <div id="page" class="wf-plugin-page"></div>
    <script src="host.js"></script>
  </body>
</html>
