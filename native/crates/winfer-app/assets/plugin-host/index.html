<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="host.css" />
    <style>
      /* The host's own frame, outside the layers so nothing in host.css or a page moves it. Like the Tauri app's
         PluginPageView: a scrolling .wf-plugin-page around the element a page mounts into. */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        user-select: none;
      }
      #scroller {
        position: relative;
        height: 100%;
        overflow-y: auto;
      }
      #page {
        height: 100%;
        user-select: text;
      }
      #error {
        margin: 24px;
        font-size: 12px;
        color: var(--color-danger);
      }
      #error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="scroller" class="wf-plugin-page">
      <p id="error"></p>
      <div id="page"></div>
    </div>
    <script src="host.js"></script>
  </body>
</html>
