[package]
name = "winfer-core"
version.workspace = true
edition.workspace = true

# winfer's GPUI-free core (docs/plans/winfer-connect.md, headless H1): state and logic the desktop app
# and the headless `winferd` share. Moved here from winfer-app a module at a time; winfer-app
# re-exports each at its old path.

[dependencies]
serde.workspace = true
serde_json.workspace = true
winfer-backend.workspace = true
regex = "1"
parking_lot = "0.12"
libc = "0.2.190"
rand = "0.10.3"
dirs = "7.0.0"
tauri.workspace = true
winfer-connect = { path = "../winfer-connect" }
alacritty_terminal = "0.26.0"
base64 = "0.23.1"
async-channel = "2"
url.workspace = true
# Checks the downloaded scrcpy server (scrcpy.rs).
sha2 = "0.11.1"
ureq = "3.4.2"

[dev-dependencies]
openh264 = "0.9"
