[package]
name = "winfer-connect"
version.workspace = true
edition.workspace = true

# Winfer Connect: pairing, encryption and transports between winfer instances
# (docs/connect/protocol.md). No GPUI: the desktop app and the headless `winferd` both use it.

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ring = "0.17"
base64 = "0.23.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
keyring = "4.2.0"
ureq = "3.4.2"
mdns-sd = "0.22.0"
