[package]
name = "winfer-backend"
version.workspace = true
edition.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-opener.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
which = "8.0.6"
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tiny_http = "0.12.0"
rand = "0.10.3"
tokio = { version = "1.53.2", features = ["sync", "time", "macros", "rt", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
base64 = "0.23.1"
ureq = { version = "3.4.2", features = ["json"] }
keyring = "4.2.0"
sha2 = "0.11.1"
hex = "0.4.3"
ring = "0.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color", "layout-cache"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"] }
similar = "3.2.0"
ignore = "0.4.33"
globset = "0.4"
unicode-width = "0.2.2"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"

# notify.rs falls back to it on Linux.
[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
tauri-plugin-notification.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"
security-framework = "3.7.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_RestartManager", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
