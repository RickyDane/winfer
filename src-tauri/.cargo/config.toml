# whisper.cpp otherwise compiles for the build machine's own CPU (GGML_NATIVE, e.g. AVX-512) and
# the app dies with an illegal instruction when it loads the speech model on users' CPUs that
# lack those extensions. Build for a common baseline instead (x86: AVX2, ~2013+; ignored on ARM).
# whisper-rs-sys forwards GGML_* env vars to whisper.cpp's CMake.
[env]
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_AVX512 = "OFF"
