[package]
name = "winfer"
version = "0.1.61"
description = "Orchestrate coding agents across tiled terminals"
authors = ["Ricky Perlick"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "winfer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
which = "8.0.6"
dirs = "7.0.0"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tiny_http = "0.12.0"
rand = "0.10.3"
tokio = { version = "1.53.2", features = ["sync", "time", "macros", "rt"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
base64 = "0.23.1"
cpal = "0.18.2"
ureq = { version = "3.4.2", features = ["json"] }
keyring = "4.2.0"
sha2 = "0.11.1"
hex = "0.4.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"
security-framework = "3.7.0"
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16.0"

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8.1"
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
